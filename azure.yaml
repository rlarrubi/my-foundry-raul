# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: my-foundry-raul

metadata:
  template: azd-init@1.31.1

services:
  "00":
    project: .workshop/step_files/00
    host: containerapp
    language: python

  01-basic:
    project: .workshop/solutions/01-basic
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true

  02-tools:
    project: .workshop/solutions/02-tools
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true

  03-mcp:
    project: .workshop/solutions/03-mcp
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true

  foundry-workshop-travel-buddy:
    project: src/foundry-workshop-travel-buddy
    host: azure.ai.agent
    language: python
    uses:
      - proj-default
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      WORKSHOP_RESOURCE_PREFIX: ${WORKSHOP_RESOURCE_PREFIX}
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    description: |
      A basic Agent Framework travel assistant hosted by Foundry.
    kind: hosted
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Travel Assistant
    name: foundry-workshop-travel-buddy
    protocols:
      - protocol: responses
        version: 2.0.0

  octotrip-flights-mcp:
    project: .workshop/mocks/octotrip_flights_mcp
    host: containerapp
    language: python

  proj-default:
    host: azure.ai.project
    endpoint: https://eclt-workshop-genai.services.ai.azure.com/api/projects/proj-default

  scripts:
    project: .workshop/scripts
    host: containerapp
    language: python

  travel-assistant:
    project: travel_assistant
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true

resources:
  "00":
    type: host.containerapp
    port: 80

  01-basic:
    type: host.containerapp
    port: 8088

  02-tools:
    type: host.containerapp
    port: 8088

  03-mcp:
    type: host.containerapp
    port: 8088

  octotrip-flights-mcp:
    type: host.containerapp
    port: 80

  scripts:
    type: host.containerapp
    port: 80

  travel-assistant:
    type: host.containerapp
    port: 8088